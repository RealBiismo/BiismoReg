<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BiismoReg | Vehicle Check</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #070b14, #000);
  font-family: Inter, sans-serif;
  color: white;
}

/* GLASS */
.glass {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.glass-soft {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
}

/* UK NUMBER PLATE */
.plate {
  display: flex;
  width: fit-content;
  margin: 0 auto;
  border-radius: 10px;
  overflow: hidden;
  border: 3px solid #111;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.plate .gb {
  background: #1d4ed8;
  color: white;
  font-weight: 800;
  padding: 10px 12px;
  font-size: 12px;
  display: flex;
  align-items: center;
}

.plate .reg {
  background: #f4f4f4;
  color: #111;
  font-weight: 900;
  font-size: 28px;
  letter-spacing: 6px;
  padding: 10px 22px;
  text-transform: uppercase;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="glass-soft p-5 text-center font-bold text-xl">
  🚗 BiismoReg Vehicle Intelligence
</div>

<!-- HERO -->
<div class="flex justify-center px-4 py-14">

  <div class="glass rounded-3xl p-8 w-full max-w-2xl text-center">

    <h1 class="text-4xl font-extrabold">FREE CAR CHECK</h1>
    <p class="text-gray-400 mt-2">DVLA • TAX • MOT HISTORY</p>

    <!-- INPUT -->
    <div class="mt-8 flex rounded-2xl overflow-hidden border border-white/10">

      <div class="bg-blue-600 px-4 flex items-center font-bold">GB</div>

      <input
        id="reg"
        class="flex-1 bg-white/5 text-center text-xl uppercase tracking-widest outline-none"
        placeholder="PN63UOS"
      />

      <button
        onclick="checkVehicle()"
        class="bg-yellow-400 px-6 font-bold hover:bg-yellow-300 transition"
      >
        CHECK
      </button>

    </div>

    <p class="text-xs text-gray-500 mt-4">
      No data stored • Official DVLA sources
    </p>

  </div>
</div>

<!-- RESULTS -->
<div id="result" class="max-w-6xl mx-auto px-4 pb-20"></div>

<script>
function formatReg(v){
  return v.toUpperCase().replace(/[^A-Z0-9]/g,'');
}

document.getElementById('reg').addEventListener('input', e=>{
  e.target.value = formatReg(e.target.value);
});

function daysUntil(date){
  if(!date) return null;
  return Math.ceil((new Date(date) - new Date()) / (1000*60*60*24));
}

function toggleMot(){
  const el = document.getElementById('motSection');
  const btn = document.getElementById('motBtn');

  if(el.classList.contains('hidden')){
    el.classList.remove('hidden');
    btn.innerText = 'Hide MOT History';
  } else {
    el.classList.add('hidden');
    btn.innerText = 'Show MOT History';
  }
}

async function checkVehicle(){

  const reg = document.getElementById('reg').value.trim().toUpperCase();
  const resultDiv = document.getElementById('result');

  if(!reg) return alert("Enter a registration");

  resultDiv.innerHTML = `
    <div class="flex justify-center py-20">
      <div class="animate-spin w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full"></div>
    </div>
  `;

  try {

    const res = await fetch('/api/check', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ registrationNumber: reg })
    });

    const data = await res.json();
    if(data.error) throw new Error(data.error);

    const motDays = daysUntil(data.motExpiryDate);
    const taxDays = daysUntil(data.taxDueDate);
    const taxed = (data.taxStatus || '').toLowerCase().includes('tax');

    resultDiv.innerHTML = `

      <div class="glass rounded-3xl p-8">

        <!-- NUMBER PLATE -->
        <div class="plate mb-6">
          <div class="gb">GB</div>
          <div class="reg">${reg}</div>
        </div>

        <!-- TITLE -->
        <div class="text-center mb-8">
          <h2 class="text-2xl text-blue-400 font-bold">
            ${data.make || ''} ${data.model || ''}
          </h2>
        </div>

        <!-- CARDS -->
        <div class="grid md:grid-cols-2 gap-6">

          <div class="glass-soft p-6 rounded-2xl">
            <p class="text-gray-400">MOT Expiry</p>
            <p class="text-2xl font-bold mt-2">
              ${data.motExpiryDate ? new Date(data.motExpiryDate).toLocaleDateString('en-GB') : 'No Data'}
            </p>

            <p class="mt-2 font-bold ${motDays < 0 ? 'text-red-500' : 'text-green-400'}">
              ${motDays < 0 ? 'EXPIRED' : 'VALID'}
              ${motDays ? ` (${motDays} days)` : ''}
            </p>
          </div>

          <div class="glass-soft p-6 rounded-2xl">
            <p class="text-gray-400">Tax Status</p>
            <p class="text-2xl font-bold mt-2">
              ${data.taxStatus || 'Unknown'}
            </p>

            <p class="mt-2 font-bold ${taxed ? 'text-green-400' : 'text-red-500'}">
              ${taxed ? 'TAXED' : 'NOT TAXED'}
              ${taxDays ? ` (${taxDays} days)` : ''}
            </p>
          </div>

        </div>

        <!-- MOT BUTTON -->
        <div class="mt-8 text-center">
          <button
            id="motBtn"
            onclick="toggleMot()"
            class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-xl font-bold transition"
          >
            Show MOT History
          </button>
        </div>

        <!-- MOT HISTORY -->
        <div id="motSection" class="hidden mt-6">

          <h3 class="text-xl font-bold mb-4">MOT History</h3>

          ${(data.motHistory || []).length ? data.motHistory.map(test => `

            <div class="glass-soft p-6 rounded-2xl mb-4">

              <div class="flex justify-between">
                <div>
                  <p class="text-lg font-bold">
                    ${new Date(test.completedDate).toLocaleDateString('en-GB')}
                  </p>
                  <p class="${test.testResult === 'PASSED' ? 'text-green-400' : 'text-red-500'} font-bold">
                    ${test.testResult}
                  </p>
                </div>

                <div class="text-right">
                  <p class="text-gray-400 text-sm">Mileage</p>
                  <p class="text-xl font-bold">${test.odometerValue || 'N/A'}</p>
                </div>
              </div>

            </div>

          `).join('') : `
            <p class="text-gray-500">No MOT history found</p>
          `}

        </div>

      </div>

    `;

  } catch(err){
    resultDiv.innerHTML = `
      <div class="text-red-500 text-center py-10 text-lg">
        ${err.message}
      </div>
    `;
  }
}

document.addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkVehicle();
});
</script>

</body>
</html>
