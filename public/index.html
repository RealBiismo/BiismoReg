<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BiismoReg</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="nav">

    <div class="logo">
      🚗 BiismoReg
    </div>

  </div>

  <div class="hero">

    <div class="search-box glass">

      <h1>
        UK Vehicle Check
      </h1>

      <p>
        MOT • TAX • Vehicle Information
      </p>

      <!-- UK PLATE -->
      <div class="plate">

        <div class="gb">
          GB
        </div>

        <input
          id="regInput"
          placeholder="PN63UOS"
          maxlength="8"
        >

      </div>

      <button onclick="checkVehicle()">
        SEARCH
      </button>

    </div>

  </div>

  <div id="result"></div>

  <script src="script.js"></script>

</body>
</html>
