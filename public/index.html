<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BiismoReg | Vehicle Check</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #0b0f1a, #000);
  font-family: Inter, sans-serif;
  color: white;
}

/* GLASS EFFECT */
.glass {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.glass-soft {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
}
</style>
</head>

<body class="min-h-screen">

<!-- NAV -->
<nav class="glass-soft p-5 flex justify-between items-center sticky top-0 z-50">
  <div class="flex items-center gap-3 font-bold text-xl">
    🚗 BiismoReg
  </div>
</nav>

<!-- HERO -->
<div class="flex justify-center items-center px-4 py-16">

  <div class="glass rounded-3xl p-8 w-full max-w-2xl text-center">

    <h1 class="text-4xl font-extrabold mb-2">FREE CAR CHECK</h1>
    <p class="text-gray-400 mb-8">DVLA • MOT HISTORY • TAX STATUS</p>

    <!-- INPUT -->
    <div class="flex rounded-2xl overflow-hidden border border-white/10">

      <div class="bg-blue-600 px-4 flex items-center font-bold">
        GB
      </div>

      <input
        id="reg"
        placeholder="PN63UOS"
        class="flex-1 bg-white/5 text-center uppercase tracking-widest text-xl outline-none"
      />

      <button
        onclick="checkVehicle()"
        class="bg-yellow-400 px-6 font-bold hover:bg-yellow-300 transition"
      >
        CHECK
      </button>

    </div>

    <p class="text-xs text-gray-500 mt-4">
      Built by car lovers — no data stored 🔒
    </p>

  </div>
</div>

<!-- RESULTS -->
<div id="result" class="max-w-6xl mx-auto px-4 pb-20"></div>

<script>
function formatReg(v){
  return v.toUpperCase().replace(/[^A-Z0-9]/g,'');
}

document.getElementById('reg').addEventListener('input', e=>{
  e.target.value = formatReg(e.target.value);
});

function daysUntil(dateStr){
  if(!dateStr) return null;
  return Math.ceil((new Date(dateStr) - new Date()) / (1000*60*60*24));
}

async function checkVehicle(){

  const reg = document.getElementById('reg').value.trim().toUpperCase();
  const resultDiv = document.getElementById('result');

  if(!reg){
    alert("Enter a registration");
    return;
  }

  // LOADER
  resultDiv.innerHTML = `
    <div class="flex justify-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-blue-500"></div>
    </div>
  `;

  try {

    const res = await fetch('/api/check', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ registrationNumber: reg })
    });

    const data = await res.json();

    if(data.error) throw new Error(data.error);

    const motDays = daysUntil(data.motExpiryDate);
    const taxDays = daysUntil(data.taxDueDate);

    const taxed = (data.taxStatus || '').toLowerCase().includes('tax');

    resultDiv.innerHTML = `

      <div class="glass rounded-3xl p-8">

        <!-- HEADER -->
        <div class="text-center mb-10">
          <h1 class="text-5xl font-bold tracking-widest">${reg}</h1>
          <p class="text-blue-400 text-2xl mt-2">
            ${data.make || ''} ${data.model || ''}
          </p>
        </div>

        <!-- CARDS -->
        <div class="grid md:grid-cols-2 gap-6">

          <!-- MOT -->
          <div class="glass-soft rounded-2xl p-6">
            <p class="text-gray-400">MOT Expiry</p>
            <p class="text-2xl font-bold mt-2">
              ${data.motExpiryDate ? new Date(data.motExpiryDate).toLocaleDateString('en-GB') : 'No Data'}
            </p>

            <p class="mt-3 font-bold ${motDays < 0 ? 'text-red-500' : 'text-green-400'}">
              ${motDays < 0 ? 'EXPIRED' : 'VALID'}
              ${motDays ? ` (${motDays} days)` : ''}
            </p>
          </div>

          <!-- TAX -->
          <div class="glass-soft rounded-2xl p-6">
            <p class="text-gray-400">Tax Status</p>
            <p class="text-2xl font-bold mt-2">
              ${data.taxStatus || 'Unknown'}
            </p>

            <p class="mt-3 font-bold ${taxed ? 'text-green-400' : 'text-red-500'}">
              ${taxed ? 'TAXED' : 'NOT TAXED'}
              ${taxDays ? ` (${taxDays} days)` : ''}
            </p>
          </div>

        </div>

        <!-- VEHICLE INFO -->
        <div class="mt-8 glass-soft rounded-2xl p-6">
          <h2 class="text-xl font-bold mb-4">Vehicle Data</h2>

          <div class="grid md:grid-cols-2 gap-3 text-sm">

            ${Object.entries(data)
              .filter(([k]) =>
                !['make','model','motExpiryDate','taxDueDate','taxStatus','motHistory'].includes(k)
              )
              .map(([k,v]) => `
                <div class="flex justify-between border-b border-white/10 py-2">
                  <span class="text-gray-400">${k}</span>
                  <span>${v ?? '—'}</span>
                </div>
              `).join('')}

          </div>
        </div>

        <!-- MOT HISTORY -->
        <div class="mt-8">
          <h2 class="text-xl font-bold mb-4">MOT History</h2>

          ${(data.motHistory || []).length ? data.motHistory.map(test => `
            
            <div class="glass-soft rounded-2xl p-6 mb-4">

              <div class="flex justify-between">
                <div>
                  <p class="text-xl font-bold">
                    ${new Date(test.completedDate).toLocaleDateString('en-GB')}
                  </p>
                  <p class="text-${test.testResult === 'PASSED' ? 'green' : 'red'}-400 font-bold">
                    ${test.testResult}
                  </p>
                </div>

                <div class="text-right">
                  <p class="text-gray-400 text-sm">Mileage</p>
                  <p class="text-xl font-bold">${test.odometerValue || 'N/A'}</p>
                </div>
              </div>

            </div>

          `).join('') : `
            <div class="text-gray-500">No MOT history found</div>
          `}

        </div>

      </div>

    `;

  } catch(err){
    resultDiv.innerHTML = `
      <div class="text-red-500 text-center py-10">
        Error: ${err.message}
      </div>
    `;
  }
}

document.addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkVehicle();
});
</script>

</body>
</html>
