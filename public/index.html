<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BiismoReg</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div class="logo">BIISMO REG</div>
  <div class="subtitle">UK Vehicle Intelligence Platform</div>
</header>

<main class="wrap">

  <section class="card">

    <div class="plate">
      <span class="gb">GB</span>
      <input id="regInput" placeholder="AB12CDE" maxlength="8">
    </div>

    <button onclick="checkVehicle()">Check Vehicle</button>

    <p class="disclaimer">
      We do not store searches. Data provided via DVLA & DVSA APIs.
    </p>

    <div id="result"></div>

  </section>

</main>

<footer>
  All rights reserved BiismoReg | RealBiismo
</footer>

<script src="script.js"></script>

</body>
</html>
