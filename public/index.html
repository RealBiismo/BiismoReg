<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="description" content="Check official UK vehicle, tax and MOT information.">
  <title>BIISMO REG — UK Vehicle Check</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="https://files.catbox.moe/ulokbl.png">
</head>
<body>
  <nav class="nav" aria-label="Main navigation">
    <img src="https://files.catbox.moe/tvw8fb.png" alt="BIISMO REG" class="logo">
  </nav>

  <main>
    <div class="hero">
      <form id="vehicleForm" class="glass search-card" novalidate>
        <h1>UK Vehicle Check</h1>
        <p>MOT • TAX • HISTORY</p>

        <label class="sr-only" for="regInput">UK registration number</label>
        <div class="plate">
          <div class="gb" aria-hidden="true">GB</div>
          <input
            id="regInput"
            name="registrationNumber"
            placeholder="PA55MGN"
            maxlength="8"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            required
          >
        </div>

        <button id="searchButton" type="submit">SEARCH</button>
        <p id="formError" class="form-error" role="alert"></p>
      </form>
    </div>

    <div class="disclaimer">
      <div class="disclaimer-title">Searches are not saved by BIISMO REG.</div>
      <div class="disclaimer-text">
        Vehicle information comes from official DVLA and DVSA services.
        Calculated insights are clearly labelled as estimates.
        <p class="creator-credit">
          Created by
          <a href="https://instagram.com/realbiismo" target="_blank" rel="noreferrer">RealBiismo</a>
        </p>
      </div>
    </div>

    <div id="result" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
