<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Your saved vehicles and BIISMO REG account.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BIISMO REG">
  <title>My Garage — BIISMO REG</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="classic.css">
  <link rel="stylesheet" href="pwa-install.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="account-page">
  <header class="site-header account-header">
    <a class="back-link" href="/" aria-label="Back to vehicle checker">
      <span aria-hidden="true">←</span>
      Back to checker
    </a>
    <a class="brand compact-brand" href="/" aria-label="BIISMO REG home">
      <img src="https://files.catbox.moe/tvw8fb.png" alt="BIISMO REG">
    </a>
    <button id="signOutButton" class="header-action" type="button">Sign out</button>
  </header>

  <main class="account-main">
    <section class="account-hero">
      <div>
        <span class="eyebrow">PRIVATE GARAGE</span>
        <h1>Your saved vehicles.</h1>
        <p id="accountEmail">Loading your account…</p>
      </div>
      <form id="garageSearchForm" class="garage-search">
        <label class="sr-only" for="garageRegInput">Search another registration</label>
        <input id="garageRegInput" type="text" maxlength="8" placeholder="Enter another reg" autocomplete="off">
        <button class="primary-button" type="submit">Check vehicle</button>
      </form>
    </section>

    <section class="garage-section" aria-labelledby="garageTitle">
      <div class="section-heading">
        <div>
          <span class="eyebrow">COLLECTION</span>
          <h2 id="garageTitle">Saved vehicles</h2>
        </div>
        <span id="vehicleCount" class="count-badge">0 vehicles</span>
      </div>

      <p id="garageStatus" class="garage-status" role="status"></p>
      <div id="garageGrid" class="garage-grid"></div>
    </section>
  </main>

  <div id="loadingOverlay" class="loading-overlay is-visible" role="status" aria-live="polite" aria-hidden="false">
    <div class="loader-card">
      <div class="progress-wheel" aria-hidden="true"></div>
      <strong>Opening your garage</strong>
      <span>Loading your securely saved vehicles…</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="pwa.js" defer></script>
  <script src="account.js" defer></script>
</body>
</html>
